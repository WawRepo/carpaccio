apiVersion: v1
kind: Service
metadata:
  name: {{ include "carpaccio.fullname" . }}
  labels:
    {{- include "carpaccio.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "carpaccio.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
