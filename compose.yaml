# `docker compose up` on a clean machine: MinIO + a one-shot bucket init +
# the app. Credentials below are for THIS local compose stack only - they
# never leave the machine and guard an empty local bucket.
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: carpaccio
      MINIO_ROOT_PASSWORD: carpaccio-local-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  # One-shot: create the bucket and switch versioning ON. Versioning is the
  # history/rollback mechanism - the app deliberately implements none itself.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 carpaccio carpaccio-local-dev &&
      mc mb --ignore-existing local/carpaccio &&
      mc version enable local/carpaccio
      "

  app:
    build: .
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CARPACCIO_S3_ENDPOINT: http://minio:9000
      CARPACCIO_S3_ACCESS_KEY: carpaccio
      CARPACCIO_S3_SECRET_KEY: carpaccio-local-dev
      CARPACCIO_S3_BUCKET: carpaccio
      CARPACCIO_S3_KEY: network.json
    ports:
      - "8000:8000"

volumes:
  minio-data:
