[project]
name = "carpaccio"
version = "0.10.2"
description = "cARPaccio - every VLAN, every address, written down. A home-network inventory sheet."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Password hashing for HTTP Basic. bcrypt directly rather than passlib:
    # passlib is unmaintained and only wraps this for one algorithm.
    "bcrypt>=4.2",
    "boto3>=1.35",
    "fastapi>=0.115",
    # The importer's HTTP client. Chosen over requests because it is already
    # the FastAPI-ecosystem default and its TestClient dependency ships anyway.
    "httpx>=0.27",
    # Signs the session cookie (TimestampSigner). Chosen over hand-rolled
    # hmac+timestamp: do not invent crypto.
    "itsdangerous>=2.2.0",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    # Starlette routes ALL form parsing through this, urlencoded included -
    # the login form does not work without it.
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
carpaccio-import = "carpaccio.importer:main"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "moto[s3]>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/carpaccio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own idiom is `Depends(...)` as an argument default; B008 doesn't
# know that FastAPI calls it once per request, not once at import time.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
