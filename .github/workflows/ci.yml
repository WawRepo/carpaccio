name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --all-groups
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      # NOT optional here, unlike the pytest version which skips when node is
      # absent. A missing paren in app.js once shipped to the cluster and the
      # page rendered as a header over an empty void: ruff, pytest and helm lint
      # all passed, because none of them read JavaScript.
      - name: JavaScript parses
        run: for f in src/carpaccio/static/*.js; do node --check "$f"; done

      - name: Test
        run: uv run pytest -q

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint chart
        run: helm lint charts/carpaccio
      - name: Template chart
        run: helm template ci charts/carpaccio > /dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Build both arches on every push (the fleet is 11 Raspberry Pis and
      # one x86 box - a single-arch image is a known past mistake), but do
      # not push: publishing is a separate, deliberate step.
      - name: Build multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
