# Cut a release: a tag becomes a multi-arch image on GHCR, and the fleet pulls
# it. Replaces building locally and importing into containerd on all 19 nodes
# by hand (HOME-460) — a release used to be 19 ssh commands, and a node that
# had been missed could not run the app at all, failing with ErrImageNeverPull
# which looks nothing like the real cause.
#
# THE PACKAGE AND THE REPOSITORY ARE SEPARATE SETTINGS on GHCR, and making the
# repo public does NOT make the package public. The nodes pull anonymously with
# no pull secret, so the package has to be public in its own right - and that
# switch exists only in the web UI. There is no REST API for package visibility
# on a personal account, so no workflow step here can do it for you.
name: release

on:
  push:
    tags: ["v*"]
  # Re-run a release by hand without moving a tag — for when a push to GHCR
  # failed and the code is fine.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.8.0)"
        required: true

permissions:
  # write, not read: the last step cuts the GitHub Release itself.
  contents: write
  packages: write
  # Both are needed for build provenance. id-token lets the runner prove which
  # workflow produced the image; without it the attestation step fails at the
  # END of a long multi-arch build, which is an expensive way to find out.
  id-token: write
  attestations: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tests gate the release. ci.yml runs them on every push too, but a
      # tag can be pushed to a commit CI never saw, and "it was green on main"
      # is not the same claim as "it is green at this tag".
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest -q

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr wants a lowercase path; the owner is "WawRepo".
      - name: Work out the image reference
        id: ref
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both arches, always. The fleet is 11 Raspberry Pis (arm64) and 8
          # x86 boxes, and the pod has no arch selector, so a single-arch image
          # fails on whichever half the scheduler happens to pick — which looks
          # intermittent rather than broken.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}
            ${{ steps.ref.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Provenance, same as ghcr.io/wawrepo/petty already carries.
      #
      # SKIPPED WHILE THIS REPOSITORY IS PRIVATE, and that is GitHub's rule
      # rather than a choice: attestation storage is "not available for
      # user-owned private repositories". Measured the hard way on the v0.7.0
      # release — the image built and pushed fine and then the run went red on
      # the very last step, which reads as a failed release when nothing was
      # wrong with the artefact.
      #
      # The condition is deliberately on repo VISIBILITY, not a hardcoded
      # false: the day HOME-341 makes this public, attestations start working
      # again with no edit here and no one having to remember.
      - name: Attach build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Note when provenance was skipped
        if: ${{ github.event.repository.private }}
        run: echo "::notice::Build provenance skipped — GitHub does not store attestations for user-owned PRIVATE repositories. The image is pushed and usable; it simply carries no provenance until this repo is public (HOME-341)." 

      # The digest is what the cluster pins. Printing it in the summary means
      # the next step — updating terraform — is copy-paste rather than a
      # separate `docker buildx imagetools inspect`.
      - name: Summary
        run: |
          {
            echo "## ${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}"
            echo
            echo '```hcl'
            echo 'default = "${{ steps.ref.outputs.image }}:${{ steps.ref.outputs.version }}@${{ steps.push.outputs.digest }}"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The GitHub Release. Cut LAST, deliberately: it is the human-visible
      # record that a version exists, so it must not appear for a build that
      # then failed to push. Everything above has to succeed first.
      #
      # `gh release create` rather than a third-party action — it ships on the
      # runner, needs no extra trust, and `--generate-notes` writes the commit
      # list for us. The digest goes in the body because that is the thing
      # anyone deploying this actually needs, and it is otherwise buried in a
      # run summary that expires.
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ref.outputs.version }}
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          notes=$(mktemp)
          {
            echo "### Image"
            echo
            echo '```'
            echo "$IMAGE:$V@$DIGEST"
            echo '```'
            echo
            echo "Multi-arch: \`linux/amd64\`, \`linux/arm64\`."
            echo
            echo "Pin by digest — a tag can be moved, a digest cannot, so what"
            echo "runs is what was built here."
          } > "$notes"

          # Idempotent on purpose: a re-run via workflow_dispatch after a
          # half-failed release must update the release, not die on "already
          # exists" and leave the notes describing the older image.
          if gh release view "$V" >/dev/null 2>&1; then
            gh release edit "$V" --notes-file "$notes" --latest
          else
            gh release create "$V" --title "$V" --notes-file "$notes" \
              --generate-notes --latest
          fi

  chart:
    # The chart ships with the image, at the same version, to the same
    # registry, as KaBOM's does (HOME-627). The homelab's Argo CD installs it
    # from ghcr.io/wawrepo/charts with no login, so the chart PACKAGE must be
    # public as well - the same web-UI-only switch as the image's, above.
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: azure/setup-helm@v4

      - name: Package and push the chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eu
          # Chart.yaml must say the same release as the tag: version without
          # the v, appVersion with it, because appVersion is the image tag the
          # chart pulls when none is set.
          version="${TAG#v}"
          chart_version=$(helm show chart charts/carpaccio | awk '/^version:/{print $2}')
          app_version=$(helm show chart charts/carpaccio | awk '/^appVersion:/{gsub(/"/, "", $2); print $2}')
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$TAG" ]; then
            echo "::error::Chart.yaml says version $chart_version, appVersion $app_version; the tag is $TAG"
            exit 1
          fi

          helm package charts/carpaccio --destination dist
          echo "$GHCR_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          # OCI names must be lowercase; the owner is "WawRepo".
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "dist/carpaccio-${version}.tgz" "oci://ghcr.io/${owner}/charts"

      # The image job cut the release, so the chart can join it.
      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "dist/carpaccio-${TAG#v}.tgz" --clobber
