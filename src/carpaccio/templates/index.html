<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cARPaccio</title>
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
  <!-- Icons: built from docs/images/icon.png by scripts/make_icons.py. Under /static on
       purpose: the only path the auth middleware leaves open, and a browser asks
       for the icon before it has logged in. static_url() adds a content
       fingerprint so a new release is a new URL (HOME-371). -->
  <link rel="icon" href="{{ static_url('favicon.ico') }}" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="{{ static_url('icon-192.png') }}" sizes="192x192">
  <link rel="apple-touch-icon" href="{{ static_url('apple-touch-icon.png') }}">
</head>
<body>
  <header>
    <h1>c<span class="arp">ARP</span>accio</h1>
    <p class="tagline">every VLAN, every address, written down<span class="editable-hint">
      — <b>every field on this page is editable</b>: click a cell, type, then Save</span></p>
    <div class="actions">
      <span id="status" class="status"></span>
      <button id="save" class="primary">Save</button>
      {% if show_logout %}
      <form class="logout-form" method="post" action="/logout">
        <button type="submit" title="end this browser session (agents on HTTP Basic are unaffected)">Log out</button>
      </form>
      {% endif %}
    </div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <nav id="tabs"></nav>
  <main id="content"></main>
  <script id="document-data" type="application/json">{{ document_json | safe }}</script>
  <script>window.CARPACCIO_VERSION = {{ version | tojson }};</script>
  <script src="{{ static_url('netcalc.js') }}"></script>
  <script src="{{ static_url('app.js') }}"></script>
</body>
</html>
